apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-scheduler
  labels:
    app: vk-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vk-scheduler
  template:
    metadata:
      labels:
        app: vk-scheduler
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vk-scheduler
          image: ghcr.io/sentoz/vk-scheduler:0.1.0
          envFrom:
            - configMapRef:
                name: vk-scheduler-env
            - secretRef:
                name: vk-scheduler-env
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: schedules
              mountPath: /schedules
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vk-scheduler-config
        - name: schedules
          configMap:
            name: vk-scheduler-schedules
