name: checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make tools check build
      - name: Check committed schemas
        run: |
          git ls-files --error-unmatch static/schemas/config.json static/schemas/schedule.json
          make schema-gen
          git diff --exit-code -- static/schemas
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'
      - run: kubectl kustomize deploy/ > /tmp/deployment.yaml
      - run: make release
      - run: docker build -t vk-scheduler:ci .
      - run: docker run --rm --network none --read-only vk-scheduler:ci --version
