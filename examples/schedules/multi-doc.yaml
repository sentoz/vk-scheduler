apiVersion: scheduler.vk/v1alpha1
kind: Schedule
metadata:
  name: vm-separate-start
spec:
  type: daily
  resource:
    type: vm
    id: 55555555-5555-4555-8555-555555555555
  actions:
    start:
      enabled: true
      time: "09:00"
---
apiVersion: scheduler.vk/v1alpha1
kind: Schedule
metadata:
  name: vm-separate-stop
spec:
  type: daily
  resource:
    type: vm
    id: 55555555-5555-4555-8555-555555555555
  actions:
    stop:
      enabled: true
      time: "18:00"
